<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Admission  Form </title>
    <link rel="stylesheet" href="styleform.css">
</head>
<body>
  <h1><center>REGISTRATION FORM OF GCET JAMMU</center></h1>
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7dGf3ctwgO_o5tcS9Go0QpBgG8175I-Hy5Hx8EorKCA&s=10" alt="Picture of Colloge" width="200">
  <form action="https://youtu.be/aSR1tndcaLE">
  
    Name: <input type="text"required><br><br>
    Email:<input type="email"required><br><br>
    Password:<input type="password"required><br><br>
    Phone:
    <input type="tel" name="phone"required><br><br>
    DOB: <input type="date"required><br><br>
    Gender:
    <input type="radio" name="g"required> Male
      <input type="radio" name="g"required> Female
    <br><br>
    Catogery:
    <select name="catogery"required>
      <option value="gen">General</option>
      <option value="obc">OBC</option>
      <option value="sc">SC</option>
      <option value="st">ST</option>
    </select><br><br>
    Subjects:
    <select name="subjects"required>
      <option value="maths">Maths</option>
      <option value="physics">Physics</option>
      <option value="chemistry">Chemistry</option>
      <option value="computer">Computer</option>
    </select><br><br>
    Address:<textarea name="address" rows="5" cols="30"required></textarea><br><br>
    Pincode:<input type="number"required><br><br>
    Domain of Interest:<br>
    <input type="checkbox" name="course" value="Web Development"required> Web Development
    <input type="checkbox" name="course" value="AI"required> AI
    <input type="checkbox" name="course" value="IT"required> IT
    <input type="checkbox" name="course" value="AutoCAd"required> AutoCAd
    <input type="checkbox" name="course" value="Cyber"required > Cyber<br>
    <input type="submit" value="submit"> 
    
    <input  type="reset" value="Reset">



  </form>
  

    
</body>
</html>
