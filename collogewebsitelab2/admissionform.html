<body>
    <!-- Form -->
    <main>
        <h2>Student Admission Form</h2>
        <div class="line"></div>

        <form action="D:\WEB LAB (YAWAR SIR)\submit.html">

            <div class="form-grid">

                <!-- Left Column -->
                <div class="left">

                    <label>Full Name: <span>*</span></label>
                    <input type="text" placeholder="Enter your name" required><br><br>
    

                    <label>Email: <span>*</span></label>
                    <input type="email" placeholder="Enter your email" required><br><br>
    

                    <label>Mobile Number: <span>*</span></label>
                    <input type="tel" placeholder="Enter mobile number" required><br><br>

                    <label>Gender: <span>*</span></label>
                    <div class="gender">
                        <label>
                            <input type="radio" name="gender"> Male
                        </label>

                        <label>
                            <input type="radio" name="gender"> Female
                        </label>

                        <label>
                            <input type="radio" name="gender"> Other
                        </label>
                    </div>

                </div><br><br>

                <!-- Right Column -->
                <div class="Right">



                    <label>Date of Birth: <span>*</span></label><br><br>
                    <input type="date" required><br><br><br><br>
    

                    <label>Course Applied For: <span>*</span></label><br><br>
                    <select required>
                        <option value="">-- Select Course --</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Electrical Engineering</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                    </select><br><br><br><br><br>
    

                    <label>Address: <span>*</span></label><br>
                    <textarea placeholder="Enter your address" required></textarea><br><br>
    
                   

                </div>

            </div>

            <!-- Buttons -->
             <div class="buttons" id="submit"> <input type="submit" value="Submit"> <br><br>
    
                   <input  type="reset" value="Reset">
</div>
